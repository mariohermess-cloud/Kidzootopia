name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/aufgaben.mjs
      - run: node tests/lernen.mjs
      - run: node tests/knacknuesse.mjs
      - run: node tests/kunst.mjs
      - run: node tests/version.mjs
      - run: node tests/silben.mjs
      - run: node tests/lesen.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Hinweis: GitHub Pages muss einmalig von Hand eingeschaltet werden
      # (Settings -> Pages -> Source: GitHub Actions). Ein Workflow-Token darf die
      # Pages-Seite nicht selbst anlegen ("Resource not accessible by integration"),
      # dafuer waeren Administrator-Rechte noetig.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
