name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Alle Fachtests aus package.json (test:* ausser test:e2e), siehe tests/alle.mjs
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Hinweis: GitHub Pages muss einmalig von Hand eingeschaltet werden
      # (Settings -> Pages -> Source: GitHub Actions). Ein Workflow-Token darf die
      # Pages-Seite nicht selbst anlegen ("Resource not accessible by integration"),
      # dafuer waeren Administrator-Rechte noetig.
      - uses: actions/configure-pages@v5
      # Nur die App-Dateien veroeffentlichen (Entscheidung Mario 05.11.2026): kein .claude/,
      # CLAUDE.md, README, tests/, docs/. Neue Dateien der App hier und in sw.js eintragen.
      - name: App-Dateien nach _site kopieren
        run: |
          mkdir _site
          cp -r index.html app.css manifest.webmanifest sw.js icons js vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
